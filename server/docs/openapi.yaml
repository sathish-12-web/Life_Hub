openapi: 3.1.0
info:
  title: LIFEHUB REST API
  description: |
    Personal productivity and life workspace API: Tasks, Planner/Events, Expenses, Notes, and Quick Capture.
    Engineered with strict multi-user tenant isolation, dual-token JWT authentication, and database-level SQL aggregation.
  version: 1.0.0
servers:
  - url: http://localhost:5000/api
    description: Local development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token passed in the Authorization header (`Bearer <token>`).
    cookieAuth:
      type: apiKey
      in: cookie
      name: refreshToken
      description: Secure, httpOnly cookie used for session renewal via `/auth/refresh`.

  schemas:
    StandardSuccess:
      type: object
      properties:
        data:
          type: object
        meta:
          type: object
      required:
        - data
        - meta

    StandardError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Invalid input parameters
            details:
              type: array
              items:
                type: object
          required:
            - code
            - message
      required:
        - error

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        timezone:
          type: string
          example: America/New_York
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [TODO, IN_PROGRESS, DONE, CANCELLED]
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH, URGENT]
        dueAt:
          type: string
          format: date-time
          nullable: true
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        reminderAt:
          type: string
          format: date-time
          nullable: true
        recurrenceRule:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Transaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        type:
          type: string
          enum: [INCOME, EXPENSE]
        amount:
          type: number
          format: double
          example: 45.50
        currency:
          type: string
          example: USD
        category:
          type: string
          example: Groceries
        occurredAt:
          type: string
          format: date-time
        note:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Note:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
        tags:
          type: array
          items:
            type: string
        archivedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

paths:
  /health:
    get:
      summary: Health & database connectivity check
      responses:
        '200':
          description: API server and PostgreSQL database active.

  /auth/register:
    post:
      summary: Register a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                timezone:
                  type: string
      responses:
        '201':
          description: User registered successfully.

  /auth/login:
    post:
      summary: Log in with credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Authentication successful. Access token returned and refresh cookie set.

  /auth/logout:
    post:
      summary: Terminate session
      responses:
        '200':
          description: Refresh cookie invalidated.

  /auth/refresh:
    post:
      summary: Refresh JWT session
      responses:
        '200':
          description: New access token generated.

  /auth/me:
    get:
      summary: Get authenticated user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Returns current user object.

  /auth/profile:
    patch:
      summary: Update user profile settings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                timezone:
                  type: string
      responses:
        '200':
          description: Profile updated.

  /tasks:
    get:
      summary: List tasks with filters & pagination
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: status
          schema:
            type: string
            enum: [TODO, IN_PROGRESS, DONE, CANCELLED]
        - in: query
          name: priority
          schema:
            type: string
            enum: [LOW, MEDIUM, HIGH, URGENT]
      responses:
        '200':
          description: List of owned tasks.
    post:
      summary: Create task
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                description:
                  type: string
                priority:
                  type: string
                  enum: [LOW, MEDIUM, HIGH, URGENT]
                dueAt:
                  type: string
                  format: date-time
                tags:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Task created.

  /tasks/stats:
    get:
      summary: Aggregated dashboard statistics for tasks
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Returns counts of total, todo, in-progress, done, and overdue tasks.

  /tasks/{id}:
    get:
      summary: Get task by ID (returns 404 for unauthorized)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task retrieved.
        '404':
          description: Not found.
    patch:
      summary: Update task
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task updated.
    delete:
      summary: Delete task
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Task deleted.

  /events:
    get:
      summary: List events with date range filter
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: List of scheduled events.
    post:
      summary: Create event
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, startAt, endAt]
              properties:
                title:
                  type: string
                startAt:
                  type: string
                  format: date-time
                endAt:
                  type: string
                  format: date-time
                reminderAt:
                  type: string
                  format: date-time
                recurrenceRule:
                  type: string
      responses:
        '201':
          description: Event created.

  /events/{id}:
    get:
      summary: Get event by ID
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Event details.
    patch:
      summary: Update event
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Event updated.
    delete:
      summary: Delete event
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Event deleted.

  /transactions:
    get:
      summary: List financial transactions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of transactions.
    post:
      summary: Create transaction
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, amount, category]
              properties:
                type:
                  type: string
                  enum: [INCOME, EXPENSE]
                amount:
                  type: number
                category:
                  type: string
                occurredAt:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Transaction created.

  /transactions/summary:
    get:
      summary: Database SQL aggregated monthly report
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: month
          schema:
            type: string
            example: '2026-11'
      responses:
        '200':
          description: Total income, total expense, net balance, and category distribution.

  /transactions/{id}:
    get:
      summary: Get transaction by ID
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Transaction details.
    patch:
      summary: Update transaction
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Transaction updated.
    delete:
      summary: Delete transaction
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Transaction deleted.

  /notes:
    get:
      summary: List notes with keyword search and tag filters
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: q
          description: Keyword search across title and body
          schema:
            type: string
        - in: query
          name: tag
          schema:
            type: string
        - in: query
          name: archived
          schema:
            type: string
            enum: ['true', 'false', 'all']
      responses:
        '200':
          description: List of notes.
    post:
      summary: Create note
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                body:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Note created.

  /notes/{id}:
    get:
      summary: Get note by ID
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Note details.
    patch:
      summary: Update note or toggle archive status
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Note updated.
    delete:
      summary: Delete note
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Note deleted.

  /capture/preview:
    post:
      summary: Parse raw input text using rule-based heuristics
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
      responses:
        '200':
          description: Returns candidate type and pre-filled fields.

  /capture/confirm:
    post:
      summary: Confirm and save captured item to destination module
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, data]
              properties:
                type:
                  type: string
                  enum: [TASK, EVENT, TRANSACTION, NOTE]
                data:
                  type: object
      responses:
        '201':
          description: Target resource successfully saved.
