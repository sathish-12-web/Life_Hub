name: LIFEHUB CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lifehub
          POSTGRES_PASSWORD: change_me
          POSTGRES_DB: lifehub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            server/package.json
            client/package.json

      - name: Install server dependencies
        run: |
          cd server
          npm ci || npm install

      - name: Install client dependencies
        run: |
          cd client
          npm ci || npm install

      - name: Deploy Prisma migrations to PostgreSQL
        run: |
          cd server
          npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://lifehub:change_me@localhost:5432/lifehub_test?schema=public

      - name: Run server linting
        run: |
          cd server
          npm run lint

      - name: Run server tests (Vitest + Supertest)
        run: |
          cd server
          npm test
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgresql://lifehub:change_me@localhost:5432/lifehub_test?schema=public
          JWT_ACCESS_SECRET: test_jwt_access_secret_for_ci_pipeline
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_for_ci_pipeline
          CLIENT_URL: http://localhost:5173

      - name: Build client production bundle (Vite)
        run: |
          cd client
          npm run build
