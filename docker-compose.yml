services:
  db:
    image: postgres:16
    container_name: lifehub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lifehub
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: lifehub
    ports:
      - "5432:5432"
    volumes:
      - lifehub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifehub -d lifehub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lifehub_pgdata:
